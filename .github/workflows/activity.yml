name: Latest activity

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update the activity section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/activity.py hysmarcos
      - name: Commit when something changed
        run: |
          if git diff --quiet README.md; then
            echo "No new activity"
            exit 0
          fi
          git config user.name "Marcos Hoyos"
          git config user.email "34328140+hysmarcos@users.noreply.github.com"
          git commit -am "chore: update latest activity"
          git push
